name: Publish rpc-sdk

on:
  push:
    tags:
      - "rpc-sdk/v*"
  workflow_dispatch:

permissions:
  id-token: write # Required for OIDC
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"
          package-manager-cache: false # never use caching in release builds
      - run: npm ci
      - run: npm run build --if-present
      - run: cp LICENSE packages/rpc-sdk/LICENSE
      - run: npm pack --dry-run --workspace=@cmdless/rpc-sdk
      - run: npm publish --workspace=@cmdless/rpc-sdk # Or: npm stage publish
