name: Publish ui-runtime

on:
  push:
    tags:
      - "ui/v*"
  workflow_dispatch:

permissions:
  id-token: write # Required for OIDC
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"
          package-manager-cache: false # never use caching in release builds
      - run: npm ci
      - run: npm run build --if-present
      - run: cp LICENSE apps/ui-runtime/LICENSE
      - run: node .github/scripts/pin-workspace-deps.mjs apps/ui-runtime/package.json
      - run: npm pack --dry-run --workspace=@cmdless/ui-runtime
      - run: npm publish --workspace=@cmdless/ui-runtime # Or: npm stage publish
